<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة NEXORA</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/admin.css"></head><body class="admin-body">
<div class="admin-wrap"><a class="brand" href="/"><span class="logo">N</span><span>NEXORA <small>DIGITAL</small></span></a>
<section id="loginPanel" class="login-panel"><div class="eyebrow">PRIVATE ADMIN</div><h1>تسجيل دخول الإدارة</h1><p>الدخول مخصص لصاحب المتجر فقط.</p><form id="loginForm"><label>اسم المستخدم<input name="username" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">دخول</button><div id="loginError" class="error"></div></form></section>
<section id="dashboard" class="dashboard hidden"><div class="dash-head"><div><div class="eyebrow">ADMIN DASHBOARD</div><h1>لوحة التحكم</h1></div><button id="logout" class="secondary">تسجيل الخروج</button></div>
<div class="dash-tabs"><button class="tab active" data-tab="products">المنتجات</button><button class="tab" data-tab="settings">إعدادات المتجر</button></div>
<div id="productsTab" class="tab-panel"><div class="dash-head"><h2>إدارة المنتجات</h2><button id="newProduct" class="primary">+ إضافة منتج</button></div><div id="adminProducts" class="admin-products"></div>
<form id="productForm" class="editor hidden"><h3 id="formTitle">منتج جديد</h3><input type="hidden" name="id"><label>اسم المنتج<input name="name" required maxlength="100"></label><label>السعر (اكتب العملة ضمن السعر)<input name="price" required maxlength="60" placeholder="مثلاً 2500 DZD"></label><label>التصنيف<input name="category" required maxlength="60" placeholder="اشتراكات / بطاقات / منتجات رقمية"></label><label>الوصف<textarea name="description" rows="3" maxlength="600"></textarea></label><label>رابط الصورة (اختياري)<input name="image" type="url" placeholder="https://..."></label><label class="inline"><input name="active" type="checkbox" checked> عرض المنتج في المتجر</label><div class="form-actions"><button class="primary" type="submit">حفظ</button><button id="cancelEdit" class="secondary" type="button">إلغاء</button></div><div id="productError" class="error"></div></form></div>
<div id="settingsTab" class="tab-panel hidden"><form id="settingsForm" class="editor"><h2>إعدادات المتجر</h2><label>عنوان الصفحة الرئيسية<input name="title" maxlength="100"></label><label>النص التعريفي<input name="subtitle" maxlength="220"></label><label>رقم واتساب (مع رمز الدولة، أرقام فقط)<input name="whatsapp" required pattern="[0-9]{8,15}"></label><button class="primary" type="submit">حفظ الإعدادات</button><div id="settingsError" class="error"></div></form></div></section>
</div><script src="/assets/admin.js"></script></body></html>
